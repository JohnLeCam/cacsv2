<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — Cac's GTA V Mods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #05050c;
      --red: #c8102e;
      --blue: #0057b8;
      --blue-light: #1a82d4;
      --white: #eef0f5;
      --grey-light: #a8aab8;
      --grey-mid: #606270;
      --border: #22222e;
      --discord: #5865F2;
      --font-display: 'Bebas Neue', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-0);
      color: var(--white);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Bandeau défilant */
    .maint-ticker {
      background: var(--red);
      overflow: hidden;
      padding: 10px 0;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .maint-ticker-track {
      display: flex;
      animation: tickerScroll 18s linear infinite;
      white-space: nowrap;
    }

    .maint-ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 0 40px;
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.25em;
      color: #fff;
    }

    .maint-ticker-dot {
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      flex-shrink: 0;
    }

    @keyframes tickerScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Fond animé */
    .maint-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 50%, rgba(200,16,46,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(0,87,184,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,87,184,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,87,184,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Contenu principal */
    .maint-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    .maint-icon {
      font-size: 4rem;
      margin-bottom: 24px;
      animation: iconPulse 2.5s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%       { transform: scale(1.08); opacity: 1; }
    }

    .maint-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid rgba(200,16,46,0.35);
      padding: 5px 18px;
      border-radius: 2px;
      background: rgba(200,16,46,0.07);
      margin-bottom: 20px;
    }

    .maint-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--white);
      margin-bottom: 16px;
    }

    .maint-title span { color: var(--red); }

    .maint-subtitle {
      font-size: 1rem;
      color: var(--grey-light);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .maint-separator {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 0 auto 40px;
    }

    /* Bouton Discord */
    .btn-discord-maint {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #5865F2;
      color: #fff;
      padding: 14px 32px;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 24px rgba(88,101,242,0.35);
      margin-bottom: 16px;
    }

    .btn-discord-maint:hover {
      background: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(88,101,242,0.5);
    }

    .maint-hint {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--grey-mid);
      letter-spacing: 0.1em;
    }

    /* Info statut connecté */
    .maint-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 30px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--grey-light);
    }

    .maint-user-info img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--red);
      display: block;
    }

    .maint-user-info strong { color: var(--white); }

    .btn-logout-maint {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--grey-mid);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      font-family: var(--font-ui);
    }

    .btn-logout-maint:hover { border-color: var(--red); color: var(--red); }

    /* Footer */
    .maint-footer {
      text-align: center;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--grey-mid);
      letter-spacing: 0.15em;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Bandeau défilant -->
  <div class="maint-ticker">
    <div class="maint-ticker-track" id="tickerTrack">
      <!-- Rempli par JS -->
    </div>
  </div>

  <div class="maint-bg"></div>
  <div class="grid-overlay"></div>

  <div class="maint-content">
    <div class="maint-icon">🔧</div>
    <div class="maint-badge">Accès restreint</div>
    <h1 class="maint-title">SITE EN <span>MAINTENANCE</span></h1>
    <div class="maint-separator"></div>
    <p class="maint-subtitle">
      Nous effectuons des travaux de maintenance.<br>
      Le site sera de retour très prochainement.<br>
      Merci de votre patience.
    </p>

    <div id="authSection">
      <!-- Rempli par JS -->
    </div>
  </div>

  <div class="maint-footer">
    CAC'S GTA V MODS &nbsp;·&nbsp; C&M MODDING &nbsp;·&nbsp; MAINTENANCE EN COURS
  </div>

  <script>
    const TICKER_TEXT = 'MAINTENANCE EN COURS';
    const REPEAT = 12;

    function buildTicker() {
      const track = document.getElementById('tickerTrack');
      let html = '';
      for (let i = 0; i < REPEAT; i++) {
        html += `<span class="maint-ticker-item">
          <span class="maint-ticker-dot"></span>
          ${TICKER_TEXT}
        </span>`;
      }
      track.innerHTML = html + html;
    }

    async function checkAuth() {
      const authSection = document.getElementById('authSection');
      try {
        const res  = await fetch('/api/user');
        const user = await res.json();

        if (user.connected) {
          authSection.innerHTML = `
            <div class="maint-user-info">
              <img src="${user.avatar}" alt="Avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
              <span>Connecté en tant que <strong>${user.username}</strong></span>
              <button class="btn-logout-maint" onclick="logout()">Déconnexion</button>
            </div>
            <p class="maint-hint">Votre compte n'a pas accès au site en maintenance.</p>
          `;
        } else {
          authSection.innerHTML = `
            <a href="/auth/discord" class="btn-discord-maint">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.082.112 18.105.131 18.12a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.076.076 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
              </svg>
              Se connecter avec Discord
            </a>
            <p class="maint-hint">Connexion réservée au staff</p>
          `;
        }
      } catch (e) {
        authSection.innerHTML = `<a href="/auth/discord" class="btn-discord-maint">Se connecter avec Discord</a>`;
      }
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.reload();
    }

    buildTicker();
    checkAuth();
  </script>
</body>
</html>
